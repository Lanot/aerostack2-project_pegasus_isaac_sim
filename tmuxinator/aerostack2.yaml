<%
require "shellwords"
# Input parameters
simulation_log_file = @settings["simulation_log_file"].to_s
follow_camera = @settings["follow_camera"].to_s
follow_drone = @settings["follow_drone"].to_s
drone_namespace           = @settings["drone_namespace"]
motion_controller_plugin  = @settings["motion_controller_plugin"]
micro_xrce_agent          = @settings["micro_xrce_agent"] == "true"
rosbag                    = @settings["rosbag"] == "true"
simulation_config_file    = @settings["simulation_config_file"]
platform_config_file      = @settings["platform_config_file"]
base_launch               = @settings["base_launch"] == "true"
%>
name: <%= drone_namespace %>
attach: false
root: ./
startup_window: mission_monitoring
windows:
  # Zenoh
  # - zenoh:
  #     layout:
  #     panes:
  #       - zenoh-bridge-ros2dds

  # Platform
  - platform:
      layout: tiled
      panes:
      # Start one simulator for the entire configured world.
      <% if base_launch %>
        - set -o pipefail; PYTHONUNBUFFERED=1 bash launch_isaacsim.bash <% if follow_camera == "true" %>--follow-camera <% elsif follow_camera == "false" %>--no-follow-camera <% end %><% unless follow_drone.empty? %>--follow-drone <%= follow_drone.shellescape %> <% end %>--config "<%= simulation_config_file %>"<% unless simulation_log_file.empty? %> 2>&1 | tee -a <%= simulation_log_file.shellescape %><% end %>
      <% end %>
      # One DDS agent serves all PX4 instances in this world.
      <% if micro_xrce_agent %>
        - MicroXRCEAgent udp4 -p 8888
      <% end %>
        - AEROSTACK2_SIMULATION_DRONE_ID=<%= drone_namespace %> ros2 launch as2_platform_pixhawk pixhawk_launch.py
            namespace:=<%= drone_namespace %>
            platform_config_file:="<%= platform_config_file %>"
            


  # Basic Robotics Functions
  - basics_robotics_functions:
      layout:
      panes:
        # State Estimation
        - ros2 launch as2_state_estimator state_estimator_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config.yaml
        # Motion Controller
        - ros2 launch as2_motion_controller controller_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config.yaml
            plugin_name:=<%= motion_controller_plugin %>
            plugin_config_file:=config/<%= motion_controller_plugin %>.yaml

  # Behaviors
  - behaviors:
      layout:
      panes:
        # Motion Behaviors
        - ros2 launch as2_behaviors_motion motion_behaviors_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config.yaml
        # Trajectory Generation Behavior
        - ros2 launch as2_behaviors_trajectory_generation generate_polynomial_trajectory_behavior_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config.yaml

  # Mission execution
  - mission_execution:
      layout:
      panes:
        # Behavior tree
        - ros2 launch as2_behavior_tree behavior_trees.launch.py
            drone_id:=<%= drone_namespace %>
            tree:=./trees/square.xml

  # Mission monitoring
  - mission_monitoring:
      layout: tiled
      panes:
        - ros2 run as2_alphanumeric_viewer as2_alphanumeric_viewer_node
            --ros-args -r  __ns:=/<%= drone_namespace %>
        - echo Run here the mission

  # Teleoperation
  - teleoperation:
      layout: tiled
      panes:
        - ros2 launch as2_keyboard_teleoperation as2_keyboard_teleoperation_launch.py 
            namespace:=<%= drone_namespace %> use_sim_time:=true

  <%- if rosbag %>
  # Rosbag
  - rosbag:
      layout:
      panes:
        - ./rosbag/record_rosbag.bash <%= drone_namespace %>
  <%- end %>

  # # Hardware interfaces
  # - hardware:
  #     layout:
  #     panes:
  #       - ros2 launch as2_usb_camera_interface as2_usb_camera_interface_launch.py
  #           namespace:=<%= drone_namespace %>
  #           config_file:=config/config.yaml
  #           camera_calibration_file:=config/camera_calibration.yaml
  #       - ros2 launch as2_realsense_interface as2_realsense_interface_launch.py
  #           namespace:=<%= drone_namespace %>
  #           device:=t265