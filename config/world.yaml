# Isaac Sim options (optional; these are the defaults):
# follow_camera: false
# follow_drone: drone0
# ros2: true
# px4: {enabled: true, autolaunch: true, model: gazebo-classic_iris}
world_name: "empty"

px4:
  enabled: true
  autolaunch: true
  enable_lockstep: false

simulation:
  physics_device: cuda
  physics_threads: -1
  render_quality: current
  direct_tensors: false
  physics_hz: 250
  render_hz: 50
  profile: false

origin: 
    latitude: 40.4405287
    longitude: -3.6898277
    altitude: 100.0

drones:
  - model_type: "quadrotor_base"
    model_name: "drone0"
    flight_time: 60
    xyz:
      - 0.0
      - 0.0
      - 0.3
#    rpy:
#      - 0.0
#      - 0.0
#      - 3.1415927 # Yaw 180°
#      # - 1.5707963 # Yaw: +90°
    payload:
      - model_type: "gps"
        model_name: "gps"
      - model_type: "gimbal_speed"
        model_name: "gimbal"
        payload:
          model_type: "hd_camera"
          model_name: "camera"
          config:
            frequency: 10
            resolution: [640, 360]
