# Isaac Sim options (optional; these are the defaults):
# follow_camera: false
# follow_drone: drone0
# ros2: true
# px4: {enabled: true, autolaunch: true, model: gazebo-classic_iris}
world_name: "empty"

px4:
  enabled: true
  autolaunch: true
  enable_lockstep: false

simulation:
  physics_hz: 250
  render_hz: 50

origin: 
    latitude: 40.337494
    longitude: -3.883197
    altitude: 100.0

drones:

  - model_type: "quadrotor_base"
    model_name: "drone0"
    flight_time: 60
    xyz:
      - -2.0
      - 0.0
      - 0.2
#    rpy:
#      - 0.0
#      - 0.0
#      - 3.1415927 # Yaw 180°
#      # - 1.5707963 # Yaw: +90°
    payload:
      - model_type: "gps"
        model_name: "gps"
      - model_type: "camera"
        model_name: "camera"
        config:
          frequency: 10
          resolution: [640, 360]

  - model_type: "quadrotor_base"
    model_name: "drone1"
    flight_time: 60
    xyz:
      - 2.0
      - 0.0
      - 0.2
#    rpy:
#      - 0.0
#      - 0.0
#      - 3.1415927 # Yaw 180°
#      # - 1.5707963 # Yaw: +90°
    payload:
      - model_type: "gps"
        model_name: "gps"
      - model_type: "camera"
        model_name: "camera"
        config:
          frequency: 10
          resolution: [640, 360]

  - model_type: "quadrotor_base"
    model_name: "drone2"
    flight_time: 60
    xyz:
      - 0.0
      - 0.0
      - 0.2
#    rpy:
#      - 0.0
#      - 0.0
#      - 3.1415927 # Yaw 180°
#      # - 1.5707963 # Yaw: +90°
    payload:
      - model_type: "gps"
        model_name: "gps"
      - model_type: "camera"
        model_name: "camera"
        config:
          frequency: 10
          resolution: [640, 360]
